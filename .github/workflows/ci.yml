name: RAG CI Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.lock.txt

      - name: Run tests
        run: python -m pytest

      - name: Run deterministic retrieval evaluation
        run: python evals/run_retrieval_eval.py

      - name: Build Docker image
        run: docker build -t rag-backend:test .
